[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-business-agents-platform"
version = "0.1.0"
description = "Local dual-mode runtime for SAPBusinessAgents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openai-codex>=0.144.4",
  "packaging>=24",
  "pydantic>=2.12,<3.0",
  "python-dotenv>=1.1,<2.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sap-business-agents = "sap_business_agents_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["agents", "tests"]
pythonpath = [
  "src",
  "agents/SD",
  "agents/FI/ap-payment/src",
  "agents/FI/ar-collection/src",
  "agents/FI/gr-ir-clearing/src",
  "agents/FI/month-end-closing/src",
  "agents/MM/procure-to-pay-status/src",
  "agents/MM/material-shortage-procurement-response/src",
  "agents/MM/inventory-health-balancing/src",
  "agents/MM/intelligent-sourcing-rfq/src",
  "agents/MM/supplier-performance-risk/src",
  "agents/SD/delivered-not-billed/src",
  "agents/SD/billing-block-diagnosis/src",
  "agents/SD/billing-completeness-check/src",
  "agents/SD/billing-output-monitor/src",
  "agents/SD/delivery-delay-prediction/src",
  "agents/SD/due-delivery-prioritization/src",
  "agents/SD/shortage-allocation-advisor/src",
  "agents/SD/billing-dispute-classification/src",
  "agents/SD/returns-credit-anomaly/src",
  "agents/SD/order-to-cash-anomaly-monitor/src",
  "agents/SD/order-to-cash-status/src",
]
