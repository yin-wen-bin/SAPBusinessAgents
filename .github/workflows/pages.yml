name: Validate and deploy SAP Business Agents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install platform and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      - name: Test and audit the clean platform with the shared prepush entry point
        run: python scripts/prepush.py --scope python --require-no-workbuddy

      - name: Set up Node.js for Windows installation
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies on Windows
        working-directory: site
        run: npm ci

      - name: Audit, check, build and test the site on Windows
        run: python scripts/prepush.py --scope site

  workbuddy-offline:
    name: WorkBuddy independent boundary tests (no SDK or external services)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies only
        run: python -m pip install -e ".[dev]"
      - name: Verify isolated protocol, ownership and fail-closed gates
        run: python -m pytest tests/test_workbuddy_isolation.py tests/test_workbuddy_feedback.py tests/test_workbuddy_remaining.py tests/test_workbuddy_native_schema.py -q

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install platform dependencies for documentation and catalog checks
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check documentation
        run: python scripts/prepush.py --scope docs

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Audit, validate, check, build and test the site
        run: python scripts/prepush.py --scope site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, python-tests, workbuddy-offline]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
