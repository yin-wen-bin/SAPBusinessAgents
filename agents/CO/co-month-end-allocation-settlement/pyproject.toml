[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-co-month-end-allocation-settlement"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
co-close-readiness = "co_month_end_allocation_settlement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
