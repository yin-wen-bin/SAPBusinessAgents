[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-product-cost-variance"
version = "0.2.0"
requires-python = ">=3.11"

[project.scripts]
product-cost-variance = "product_cost_variance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
