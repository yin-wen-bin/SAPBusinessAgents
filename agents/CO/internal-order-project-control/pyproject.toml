[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-internal-order-project-control"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
order-project-control = "internal_order_project_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
