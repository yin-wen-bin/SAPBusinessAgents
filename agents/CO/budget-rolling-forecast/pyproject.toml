[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-budget-rolling-forecast"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
budget-rolling-forecast = "budget_rolling_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
