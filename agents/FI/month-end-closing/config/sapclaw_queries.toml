# A catalog match alone is not enough to run a closing check. production_approved
# means schema, server-side scope, pagination, currency/null/sign rules, and the
# business exception definition were reviewed. A GUI transaction baseline is
# not required. Missing or incomplete MCP checks may use an explicitly supplied,
# checksum-verified SE16N manifest; no fallback is selected silently.

[[queries]]
check_id = "AP_OVERDUE_ITEMS"
production_approved = false
validation_status = "Live schema and execution confirmed, but the result exceeds one page and contains null due dates and balancing pairs; pagination, key-date and deduplication rules are not yet approved."
service_name = "API_OPLACCTGDOCITEMCUBE_SRV"
resource_path = "A_OperationalAcctgDocItemCube"
filter_template = "CompanyCode eq '{company_code}' and Supplier ne '' and PostingDate le {period_end_odata} and (ClearingDate eq null or ClearingDate gt {period_end_odata}) and NetDueDate le {period_end_odata}"
select_fields = [
  "CompanyCode",
  "FiscalYear",
  "AccountingDocument",
  "AccountingDocumentItem",
  "Supplier",
  "PostingDate",
  "NetDueDate",
  "ClearingDate",
  "AmountInCompanyCodeCurrency",
  "CompanyCodeCurrency",
]
display_fields = [
  "AccountingDocument",
  "AccountingDocumentItem",
  "Supplier",
  "PostingDate",
  "NetDueDate",
  "ClearingDate",
  "AmountInCompanyCodeCurrency",
  "CompanyCodeCurrency",
]
support_fields = ["CompanyCode", "FiscalYear"]
amount_field = "AmountInCompanyCodeCurrency"
amount_mode = "absolute_sum"
currency_field = "CompanyCodeCurrency"
max_rows = 1000
evidence_limit = 20

