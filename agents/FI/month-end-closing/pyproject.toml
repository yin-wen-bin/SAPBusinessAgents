[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-month-end-closing-assistant"
version = "0.2.0"
description = "A safe, read-only month-end closing assessment assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
month-end-closing = "sap_business_agents.month_end_closing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
