[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ar-collection-assistant"
version = "0.1.0"
description = "Review-first SAP AR collection assistant vertical slice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ar-collection = "ar_collection_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ar_collection_assistant = ["fixtures/*.json"]
