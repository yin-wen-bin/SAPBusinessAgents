[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-billing-output-monitor"
version = "0.1.0"
description = "Billing Output Monitor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
billing-output-monitor = "billing_output_monitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billing_output_monitor = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
