[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-billing-completeness-check"
version = "0.1.0"
description = "Billing Completeness Check"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
billing-completeness-check = "billing_completeness_check.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billing_completeness_check = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
