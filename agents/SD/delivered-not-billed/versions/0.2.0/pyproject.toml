[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-delivered-not-billed"
version = "0.1.0"
description = "Delivered-not-Billed Monitor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delivered-not-billed = "delivered_not_billed.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delivered_not_billed = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
