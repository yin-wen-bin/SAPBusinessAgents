[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-order-to-cash-anomaly-monitor"
version = "0.1.0"
description = "Order-to-Cash Anomaly Monitor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
order-to-cash-anomaly-monitor = "order_to_cash_anomaly_monitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_to_cash_anomaly_monitor = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
