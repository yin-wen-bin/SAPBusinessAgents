[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-billing-block-diagnosis"
version = "0.1.0"
description = "Billing Block Diagnosis"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
billing-block-diagnosis = "billing_block_diagnosis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billing_block_diagnosis = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
