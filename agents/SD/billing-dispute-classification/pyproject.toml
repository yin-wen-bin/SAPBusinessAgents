[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-billing-dispute-classification"
version = "0.1.0"
description = "Billing Dispute Classification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
billing-dispute-classification = "billing_dispute_classification.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billing_dispute_classification = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
