[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-delivery-delay-prediction"
version = "0.1.0"
description = "Delivery Delay Prediction"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delivery-delay-prediction = "delivery_delay_prediction.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delivery_delay_prediction = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
