[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-material-shortage-procurement-response"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
shortage-procurement = "material_shortage_procurement_response.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
