[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-supplier-performance-risk"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
supplier-delivery-risk = "supplier_performance_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
