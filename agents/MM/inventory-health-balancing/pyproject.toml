[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-inventory-health-balancing"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
inventory-health = "inventory_health_balancing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
